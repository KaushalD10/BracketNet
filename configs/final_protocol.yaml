  - 206
  - 207
  - 208
  - 209
  alignment_pairs: 'disjoint seed pairs (100,101), (102,103), ..., (118,119): 10 independent pairs'
  probe_seeds:
    alignment_fit: 998
    transfer_eval: 997
  metrics:
  - 1-step and 10-step chained observation MSE
  - composition MSE
  - closure residual (eps=1e-6 and exact)
  - whitened (span-only) closure
  - generator rank, singular values, Gram condition
  - delta bound (Lemma 1)
  - ground-truth algebra distance and coverage after Procrustes
  - CKA and Procrustes residual vs truth
  - action disagreement vs truth
  - structural category
  - cross-seed algebra distance / CKA / action disagreement
  - cross-model transformation transfer
  - runtime and convergence
  statistics: 'One-sided, final BracketNet vs +Comp. on fresh seeds, Holm-corrected over the family: H1 closure
    (T2, SO3); H2 ground-truth algebra distance (T2, SO3); H3 cross-seed algebra distance on disjoint seed pairs
    (T2, SO3). Test: exact paired sign-flip test on per-seed (or per-pair) differences. Transport, transfer and
    all other quantities are secondary and reported two-sided without claims of significance unless the 95 % CI
    excludes zero.

    '
  thresholds: 'Structural categories (fixed here, before any fresh-seed result): collapsed if sigma_min/sigma_max
    of the generator matrix B < 0.1; closed if closure residual <= 0.01 * (mean closure of random sqrt(2)-normalized
    K-spans of so(d)); correct-closed if closed and ground-truth algebra distance <= 0.1 * chance distance; incorrect-closed
    otherwise (for SO3, subtype ''chiral'' if participation ratio >= 3); ''accurate structure, inaccurate action''
    if correct-closed and normalized action disagreement with the ground truth > 0.5.

    '
