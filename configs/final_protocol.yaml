# AUTO-GENERATED by scripts/freeze_protocol.py from dev-phase results only. Do not edit by hand.
status: FROZEN before any fresh-seed (100-119) or ablation-seed (200-209) run
method_name: 'BracketNet (revised): closure-regularized fit-close-refit with validation-selected closure weight'
note: This is a REVISED method. It is not a reproduction of the original manuscript's lambda=0.1 protocol; lambda=0.1
  at the same budget is evaluated as a reference variant 'bracketnet_lam0.1'.
data:
  groups:
    SO2: so(2) in so(3), K=1
    T2: t^2 in so(5), K=2
    SO3: so(3) in so(4), K=3
  coef_std: 0.24
  states: z0 ~ N(0, I_d)
  observation_map: x = Qz + 0.18 tanh(Bz), p = d, one fixed map per group (seeds 101/102/103), shared by all splits
  n_train_triples: 1400
  n_test_sequences: 500
  test_edges: 10
model:
  encoder_decoder_action: 2-hidden-layer MLPs, width 64, SiLU
  latent_dim: d
  coef_bound: 0.65 tanh
  generator_init: W ~ N(0, 1/d)
  generator_normalization: antisymmetrize, ||A_k||_F = sqrt(2) every forward pass
training:
  steps: 4000
  closure_weight: 3.0
  closure_mode: reg
  schedule: 'staged: lambda=0 for first 35 % of updates, linear ramp to lambda by 70 %, generators frozen for final
    30 %'
  loss: 4 L_rec + 32 L_loc,lat + 2 L_loc,obs + 1.2 L_comp (comp/BracketNet) + lambda(t) L_close + 1 L_basis(2I)
    + 16 ||Cov(z) - I||_F^2
  shared:
    w_cov: 16.0
    lr: 0.002
    weight_decay: 1.0e-05
    batch: 160
    clip: 5.0
    eps: 1.0e-06
    w_basis: 1.0
  optimizer: AdamW, lr 2e-3, wd 1e-5, batch 160, global grad-norm clip 5
  model_selection: 'none: the final iterate is evaluated (no early stopping, no checkpoint selection)'
evaluation:
  groups:
  - SO2
  - T2
  - SO3
  methods:
  - local
  - comp
  - bracketnet
  - bracketnet_lam0.1
  test_seeds:
  - 100
  - 101
  - 102
  - 103
  - 104
  - 105
